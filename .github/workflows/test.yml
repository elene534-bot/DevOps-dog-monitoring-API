name: Dog API CI/CD Pipeline

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python (Build Stage)
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies (Build Stage)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest (Test Stage)
      run: |
        pytest

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - name: Deploying Application
      run: |
        echo "Deploying Dog Monitoring System API to production environment..."